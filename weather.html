<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>14-Day Weather Calendar</title>
    <style>
        body { font-family: system-ui, -apple-system, sans-serif; max-width: 800px; margin: 2rem auto; padding: 0 1rem; }
        .search-box { display: flex; gap: 0.5rem; margin-bottom: 2rem; }
        .input-wrap { position: relative; flex: 1; }
        input { width: 100%; box-sizing: border-box; padding: 0.75rem 2.9rem 0.75rem 0.75rem; border: 1px solid #ccc; border-radius: 4px; font-size: 1rem; }
        .loc-btn { position: absolute; right: 4px; top: 4px; bottom: 4px; width: 2.4rem; padding: 0; background: transparent; color: #0056b3; border-radius: 4px; display: grid; place-items: center; }
        .loc-btn:hover { background: #e8f0fa; }
        .loc-btn svg { width: 1.3rem; height: 1.3rem; }
        .loc-btn.busy svg { animation: pulse 1s ease-in-out infinite; }
        @keyframes pulse { 50% { opacity: .3; } }
        button { padding: 0.75rem 1.5rem; background: #0056b3; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 1rem; }
        button:hover { background: #004494; }
        button:focus-visible, input:focus-visible { outline: 3px solid #0056b3; outline-offset: 2px; }
        .suggestions { position: absolute; left: 0; right: 0; top: calc(100% + 4px); z-index: 10; margin: 0; padding: 0.25rem 0; list-style: none; background: #fff; border: 1px solid #ccc; border-radius: 6px; box-shadow: 0 6px 18px rgba(0,0,0,.12); max-height: 280px; overflow-y: auto; }
        .suggestions[hidden] { display: none; }
        .suggestions li { padding: 0.55rem 0.85rem; cursor: pointer; }
        .suggestions li small { display: block; color: #666; }
        .suggestions li:hover, .suggestions li.active { background: #e8f0fa; }
        .calendar { display: grid; grid-template-columns: repeat(auto-fill, minmax(110px, 1fr)); gap: 1rem; }
        .day-card { border: 1px solid #e0e0e0; border-radius: 8px; padding: 1rem; text-align: center; background: #fafafa; }
        .day-card.today { border: 2px solid #0056b3; }
        .day-card .date { font-weight: bold; margin-bottom: 0.5rem; font-size: 0.9rem; }
        .day-card .icon { font-size: 1.6rem; }
        .day-card .temp { font-size: 1.1rem; color: #333; margin: 0.5rem 0; }
        .day-card .condition { font-size: 0.8rem; color: #666; }
        .error { color: #d32f2f; margin-top: 1rem; font-weight: bold; }
        .status { color: #666; margin-top: 1rem; }
    </style>
</head>
<body>
    <h1>Weather Calendar</h1>
    <div class="search-box">
        <div class="input-wrap">
            <input type="text" id="cityInput" placeholder="Enter city name (e.g., London)"
                   autocomplete="off" role="combobox" aria-expanded="false"
                   aria-controls="suggestions" aria-autocomplete="list" aria-label="City name">
            <button type="button" class="loc-btn" id="locBtn" title="Use my current location" aria-label="Use my current location">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <circle cx="12" cy="12" r="3"/><circle cx="12" cy="12" r="7"/>
                    <path d="M12 1v4M12 19v4M1 12h4M19 12h4"/>
                </svg>
            </button>
            <ul class="suggestions" id="suggestions" role="listbox" hidden></ul>
        </div>
        <button type="button" id="goBtn">Get Forecast</button>
    </div>
    <div id="error" class="error"></div>
    <div id="status" class="status"></div>
    <div id="calendar" class="calendar"></div>

    <script>
    const WMO = {
        0:['Clear sky','☀️'], 1:['Mainly clear','🌤️'], 2:['Partly cloudy','⛅'], 3:['Overcast','☁️'],
        45:['Fog','🌫️'], 48:['Rime fog','🌫️'],
        51:['Light drizzle','🌦️'], 53:['Drizzle','🌦️'], 55:['Heavy drizzle','🌧️'],
        56:['Freezing drizzle','🌧️'], 57:['Heavy freezing drizzle','🌧️'],
        61:['Light rain','🌦️'], 63:['Rain','🌧️'], 65:['Heavy rain','🌧️'],
        66:['Freezing rain','🌧️'], 67:['Heavy freezing rain','🌧️'],
        71:['Light snow','🌨️'], 73:['Snow','🌨️'], 75:['Heavy snow','❄️'], 77:['Snow grains','❄️'],
        80:['Light showers','🌦️'], 81:['Showers','🌧️'], 82:['Heavy showers','⛈️'],
        85:['Snow showers','🌨️'], 86:['Heavy snow showers','❄️'],
        95:['Thunderstorm','⛈️'], 96:['Storm with hail','⛈️'], 99:['Heavy storm with hail','⛈️']
    };

    const input = document.getElementById('cityInput');
    const list = document.getElementById('suggestions');
    const errorDiv = document.getElementById('error');
    const statusDiv = document.getElementById('status');
    const calendarDiv = document.getElementById('calendar');
    const locBtn = document.getElementById('locBtn');

    let selectedLoc = null;     // set when the user picks a suggestion (exact coordinates)
    let suggestions = [];
    let activeIndex = -1;
    let debounceTimer = null;
    let suggestAbort = null;

    const placeName = l => [l.name, l.admin1, l.country].filter(Boolean).join(', ');

    /* ---------- Suggestions ---------- */
    function hideSuggestions() {
        list.hidden = true;
        input.setAttribute('aria-expanded', 'false');
        activeIndex = -1;
    }

    function renderSuggestions() {
        list.replaceChildren();
        if (!suggestions.length) return hideSuggestions();
        suggestions.forEach((loc, i) => {
            const li = document.createElement('li');
            li.role = 'option';
            li.id = 'sugg-' + i;
            const name = document.createElement('span');
            name.textContent = loc.name;
            const sub = document.createElement('small');
            sub.textContent = [loc.admin1, loc.country].filter(Boolean).join(', ');
            li.append(name, sub);
            li.addEventListener('mousedown', e => { e.preventDefault(); chooseSuggestion(i); });
            list.appendChild(li);
        });
        list.hidden = false;
        input.setAttribute('aria-expanded', 'true');
    }

    function setActive(i) {
        const items = list.children;
        if (!items.length) return;
        activeIndex = (i + items.length) % items.length;
        [...items].forEach((li, idx) => li.classList.toggle('active', idx === activeIndex));
        input.setAttribute('aria-activedescendant', items[activeIndex].id);
        items[activeIndex].scrollIntoView({ block: 'nearest' });
    }

    async function fetchSuggestions(q) {
        if (suggestAbort) suggestAbort.abort();
        suggestAbort = new AbortController();
        try {
            const res = await fetch(
                `https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(q)}&count=6&language=en`,
                { signal: suggestAbort.signal });
            if (!res.ok) return;
            const data = await res.json();
            suggestions = data.results || [];
            renderSuggestions();
        } catch (e) { /* aborted or offline: ignore */ }
    }

    function chooseSuggestion(i) {
        const loc = suggestions[i];
        if (!loc) return;
        selectedLoc = loc;
        input.value = placeName(loc);
        hideSuggestions();
        loadForecast(loc);
    }

    input.addEventListener('input', () => {
        selectedLoc = null;
        clearTimeout(debounceTimer);
        const q = input.value.trim();
        if (q.length < 2) { hideSuggestions(); return; }
        debounceTimer = setTimeout(() => fetchSuggestions(q), 250);
    });

    input.addEventListener('keydown', e => {
        const open = !list.hidden;
        if (e.key === 'ArrowDown') { e.preventDefault(); if (open) setActive(activeIndex + 1); }
        else if (e.key === 'ArrowUp') { e.preventDefault(); if (open) setActive(activeIndex - 1); }
        else if (e.key === 'Escape') { hideSuggestions(); }
        else if (e.key === 'Enter') {
            e.preventDefault();
            if (open && activeIndex >= 0) chooseSuggestion(activeIndex);
            else { hideSuggestions(); getWeather(); }
        }
    });

    input.addEventListener('blur', hideSuggestions);
    document.getElementById('goBtn').addEventListener('click', () => { hideSuggestions(); getWeather(); });

    /* ---------- Current location ---------- */
    locBtn.addEventListener('click', () => {
        errorDiv.textContent = '';
        if (!navigator.geolocation) {
            errorDiv.textContent = 'Your browser does not support location.';
            return;
        }
        locBtn.classList.add('busy');
        statusDiv.textContent = 'Finding your location…';
        navigator.geolocation.getCurrentPosition(async pos => {
            const { latitude, longitude } = pos.coords;
            let loc = { name: 'Your location', latitude, longitude };
            try {
                // Free reverse geocoding, no key needed
                const r = await fetch(`https://api.bigdatacloud.net/data/reverse-geocode-client?latitude=${latitude}&longitude=${longitude}&localityLanguage=en`);
                if (r.ok) {
                    const g = await r.json();
                    loc.name = g.city || g.locality || g.principalSubdivision || 'Your location';
                    loc.admin1 = g.principalSubdivision && g.principalSubdivision !== loc.name ? g.principalSubdivision : '';
                    loc.country = g.countryName || '';
                }
            } catch (e) { /* keep fallback name */ }
            selectedLoc = loc;
            input.value = loc.name === 'Your location' ? '' : placeName(loc);
            locBtn.classList.remove('busy');
            hideSuggestions();
            loadForecast(loc);
        }, err => {
            locBtn.classList.remove('busy');
            statusDiv.textContent = '';
            errorDiv.textContent = err.code === 1
                ? 'Location permission was denied. Allow it in your browser settings, or type a city.'
                : 'Could not get your location. Try typing a city instead.';
        }, { enableHighAccuracy: false, timeout: 10000, maximumAge: 300000 });
    });

    /* ---------- Weather ---------- */
    async function getWeather() {
        const city = input.value.trim();
        errorDiv.textContent = '';
        if (!city) { errorDiv.textContent = 'Please enter a city name.'; return; }

        if (selectedLoc) return loadForecast(selectedLoc);

        try {
            statusDiv.textContent = 'Loading…';
            calendarDiv.innerHTML = '';
            const geoRes = await fetch(`https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(city)}&count=1&language=en`);
            if (!geoRes.ok) throw new Error(`Geocoding failed (${geoRes.status})`);
            const geo = await geoRes.json();
            if (!geo.results || !geo.results.length) throw new Error(`City not found: "${city}"`);
            selectedLoc = geo.results[0];
            await loadForecast(selectedLoc);
        } catch (err) {
            statusDiv.textContent = '';
            errorDiv.textContent = `Error: ${err.message}`;
        }
    }

    async function loadForecast(loc) {
        errorDiv.textContent = '';
        calendarDiv.innerHTML = '';
        statusDiv.textContent = 'Loading…';
        try {
            const url = `https://api.open-meteo.com/v1/forecast?latitude=${loc.latitude}&longitude=${loc.longitude}` +
                        `&daily=temperature_2m_max,temperature_2m_min,weather_code&forecast_days=14&timezone=auto`;
            const res = await fetch(url);
            if (!res.ok) throw new Error(`Forecast request failed (${res.status})`);
            const fc = await res.json();
            const days = (fc.daily && fc.daily.time) || [];
            if (!days.length) throw new Error('No forecast data returned.');

            days.forEach((dateStr, i) => {
                const d = new Date(dateStr + 'T12:00:00');
                const dayName = d.toLocaleDateString('en-US', { weekday: 'short' });
                const dateNum = d.toLocaleDateString('en-US', { day: 'numeric', month: 'short' });
                const min = fc.daily.temperature_2m_min[i];
                const max = fc.daily.temperature_2m_max[i];
                const [phrase, icon] = WMO[fc.daily.weather_code[i]] || ['No data', '❔'];

                const card = document.createElement('div');
                card.className = 'day-card' + (i === 0 ? ' today' : '');
                card.innerHTML = `
                    <div class="date">${i === 0 ? 'Today' : `${dayName}, ${dateNum}`}</div>
                    <div class="icon">${icon}</div>
                    <div class="temp">${Math.round(min)}° to ${Math.round(max)}°C</div>
                    <div class="condition">${phrase}</div>`;
                calendarDiv.appendChild(card);
            });
            statusDiv.textContent = `14-day forecast for ${placeName(loc)}`;
        } catch (err) {
            statusDiv.textContent = '';
            errorDiv.textContent = `Error: ${err.message}`;
        }
    }
    </script>
</body>
</html>
